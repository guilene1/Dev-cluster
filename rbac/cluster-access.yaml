# Cluster-wide RBAC for the shared-cluster user model (see README "Shared
# cluster access"). Applied once by scripts/setup.sh; safe to re-apply.
#
# Model: every participant is a ServiceAccount in the `lab-users` namespace
# (created by scripts/users.sh). Kubernetes automatically puts each of them in
# the group `system:serviceaccounts:lab-users`, so the cluster-wide read access
# below is granted to that ONE group -- there is nothing to bind per user. Only
# the personal sandbox binding (rbac/user-sandbox.yaml.tpl) is per user.
apiVersion: v1
kind: Namespace
metadata:
  name: lab-users
  labels:
    app.kubernetes.io/part-of: sre-lab
---
# Read-only access to every namespace, using Kubernetes' built-in `view` role.
# `view` deliberately EXCLUDES Secrets, which is what keeps the Datadog API/app
# keys (datadog/datadog-secret), the RDS credentials (<app>/<app>-db-credentials)
# and every participant's own token Secret (lab-users) unreadable. It includes
# pod logs, events, Ingresses, HPAs, quotas, and -- once metrics-server is
# installed -- `kubectl top`, via that project's aggregate-to-view role.
#
# Do not "fix" a missing permission here by swapping in `edit` or `admin`:
# both can read Secrets.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-lab-users-view
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:lab-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: view
---
# `view` is namespaced-resources only, so `kubectl get nodes` and
# `kubectl get ns` would be denied without this.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-lab-cluster-reader
rules:
  - apiGroups: [""]
    resources: [nodes, namespaces, persistentvolumes]
    verbs: [get, list, watch]
  - apiGroups: [storage.k8s.io]
    resources: [storageclasses]
    verbs: [get, list, watch]
  - apiGroups: [networking.k8s.io]
    resources: [ingressclasses]
    verbs: [get, list, watch]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sre-lab-users-cluster-reader
subjects:
  - apiGroup: rbac.authorization.k8s.io
    kind: Group
    name: system:serviceaccounts:lab-users
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sre-lab-cluster-reader
---
# Write access, granted ONLY inside a participant's own sandbox namespace via a
# RoleBinding (a RoleBinding to a ClusterRole is namespace-scoped). Combined
# with the cluster-wide read above, this is the whole permission set.
#
# What is deliberately absent, and why:
#   ingresses          the AWS Load Balancer Controller acts on any Ingress in
#                      any namespace. An Ingress with the `dev-cluster` group name
#                      and a lab hostname could hijack the shared ALB's routing
#                      for all five apps; one without it creates a new, billable
#                      ALB.
#   networkpolicies    not enforced by this cluster's CNI configuration; a
#                      policy that looks protective but isn't would mislead.
#   serviceaccounts,   no way to mint identities or grant themselves more
#   roles, rolebindings  access (privilege escalation).
#   resourcequotas,    the sandbox ceiling must not be editable by its owner.
#   limitranges
#   nodes, namespaces  cluster-scoped, never writable by participants.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sre-lab-sandbox-user
rules:
  - apiGroups: [""]
    resources:
      - pods
      - pods/exec
      - pods/attach
      - pods/portforward
      - services
      - configmaps
      - secrets
      - persistentvolumeclaims
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [apps]
    resources: [deployments, deployments/scale, replicasets, statefulsets, daemonsets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [batch]
    resources: [jobs, cronjobs]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [autoscaling]
    resources: [horizontalpodautoscalers]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
  - apiGroups: [policy]
    resources: [poddisruptionbudgets]
    verbs: [get, list, watch, create, update, patch, delete, deletecollection]
